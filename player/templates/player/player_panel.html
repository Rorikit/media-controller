<section class="player-card" data-player-root>
    <div class="player-layout">
        <div class="vinyl-player" data-vinyl>
            <div class="vinyl-glow"></div>
            <div class="vinyl-disc">
                <div class="vinyl-shine"></div>
                <div class="vinyl-label">
                    <img src="" alt="" data-vinyl-cover hidden>
                    <span data-vinyl-placeholder></span>
                </div>
            </div>
            <div class="tonearm"></div>
        </div>

        <div class="player-controls-panel">
            <div class="now-playing">
                <span class="pulse-dot"></span>
                <div>
                    <small>Сейчас играет</small>
                    <h2 data-current-title>Выберите трек</h2>
                    <p data-current-artist>Исполнитель появится здесь</p>
                </div>
            </div>
        </div>
    </div>
</section>
